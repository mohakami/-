<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة الدخول والخروج</title>
<style>
body {
font-family:Tahoma,Arial;
background:linear-gradient(135deg,#07172f,#0d2346);
color:white;
padding:20px;
margin:0;
}
.container {
max-width:1000px;
margin:auto;
}
.card {
background:rgba(255,255,255,.08);
padding:20px;
border-radius:20px;
margin-bottom:20px;
}
input {
width:100%;
padding:15px;
border:none;
border-radius:12px;
margin:8px 0 15px;
font-size:16px;
}
.buttons {
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}
button {
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
.in{background:#2ecc71;color:white}
.out{background:#ff4d4d;color:white}
.save{background:#d6a84f;color:black}

table {
width:100%;
border-collapse:collapse;
background:white;
color:black;
}
th,td {
border:1px solid #ddd;
padding:10px;
text-align:center;
}
th {
background:#0d2346;
color:white;
}

.small {
font-size:11px;
color:#666;
}

#status {
margin-top:15px;
font-weight:bold;
}

@media(max-width:700px){
.buttons{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="container">

<div class="card">
<h1>بوابة تسجيل الدخول والخروج</h1>

<label>اسم الشخص</label>
<input type="text" id="name" placeholder="أدخل الاسم">

<label>اسم مدخل البيانات</label>
<input type="text" id="operator" placeholder="أدخل اسم مدخل البيانات">

<div class="buttons">
<button class="in" onclick="setAction('دخول')">تسجيل دخول</button>
<button class="out" onclick="setAction('خروج')">تسجيل خروج</button>
<button class="save" onclick="saveData()">حفظ</button>
</div>

<p id="status"></p>
</div>

<div class="card">
<h2>البيانات المسجلة</h2>

<table>
<thead>
<tr>
<th>#</th>
<th>اليوم</th>
<th>التاريخ الهجري</th>
<th>الاسم</th>
<th>الدخول</th>
<th>الخروج</th>
<th>مدخل البيانات</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<script>

let currentAction = "";

function setAction(action){
currentAction = action;
document.getElementById("status").innerHTML = "تم اختيار: " + action;
}

function getHijriDate(){
return new Intl.DateTimeFormat('ar-SA-u-ca-islamic', {
day:'2-digit',
month:'2-digit',
year:'numeric'
}).format(new Date());
}

function getDay(){
const days = [
"الأحد","الاثنين","الثلاثاء",
"الأربعاء","الخميس","الجمعة","السبت"
];
return days[new Date().getDay()];
}

function getTime(){
const d = new Date();
return String(d.getHours()).padStart(2,'0') + ":" +
String(d.getMinutes()).padStart(2,'0') + ":" +
String(d.getSeconds()).padStart(2,'0');
}

function saveData(){
const name = document.getElementById("name").value.trim();
const operator = document.getElementById("operator").value.trim();

if(!name){
alert("يرجى إدخال الاسم");
return;
}

if(!operator){
alert("يرجى إدخال اسم مدخل البيانات");
return;
}

if(!currentAction){
alert("اختر دخول أو خروج");
return;
}

const hijriDate = getHijriDate();

const record = {
day:getDay(),
hijriDate:hijriDate,
name:name,
entry: currentAction === "دخول" ? getTime() : "",
exit: currentAction === "خروج" ? getTime() : "",
operator:operator
};

let records = JSON.parse(localStorage.getItem("records") || "[]");
records.push(record);
localStorage.setItem("records", JSON.stringify(records));

fetch("https://script.google.com/macros/s/AKfycbzZXTfCLzp3A26cJsCck8tFSeea4_Jd_oXdCRnpJSEwArCdCQJHD2N2_DIzw0yE2zU3/exec", {
method:"POST",
mode:"no-cors",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
hijriDate:hijriDate,
name:name,
action:currentAction,
operator:operator
})
});

document.getElementById("status").innerHTML =
"تم الحفظ والإرسال إلى Google Sheet";

document.getElementById("name").value = "";
document.getElementById("operator").value = "";
currentAction = "";

renderTable();
}

function renderTable(){
let records = JSON.parse(localStorage.getItem("records") || "[]");

let html = "";

records.forEach((r,index)=>{
html += `
<tr>
<td>${index+1}</td>
<td>${r.day}</td>
<td>${r.hijriDate}</td>
<td>${r.name}</td>
<td>${r.entry || "-"}</td>
<td>${r.exit || "-"}</td>
<td><span class="small">${r.operator}</span></td>
</tr>
`;
});

document.getElementById("tableBody").innerHTML = html;
}

renderTable();

</script>

</body>
</html>
